<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoHub - AUTO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f9;
        }

        .chat-container {
            width: 350px;
            height: 430px;
            margin: 50px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <iframe
            allow="microphone;"
            src="https://console.dialogflow.com/api-client/demo/embedded/075a38f9-83fe-43cc-916a-02ff3234b524">
        </iframe>

    </div>

</body>
</html>
