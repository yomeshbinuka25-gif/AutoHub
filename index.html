<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoHub - AUTO</title>

    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #ffffff;
        }

        df-messenger {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;

            --df-messenger-button-titlebar-color: #28a745;
            --df-messenger-button-titlebar-font-color: #ffffff;
            --df-messenger-chat-background-color: #ffffff;
            --df-messenger-bot-message: #f1f3f5;
            --df-messenger-user-message: #28a745;
            --df-messenger-font-color: #212529;
            --df-messenger-input-box-color: #ffffff;
            --df-messenger-input-font-color: #212529;
            --df-messenger-send-icon: #28a745;
        }
    </style>
</head>

<body>

    <df-messenger
        id="autoMessenger"
        intent="WELCOME"
        chat-title="AUTO"
        agent-id="075a38f9-83fe-43cc-916a-02ff3234b524"
        language-code="en"
        expand>
    </df-messenger>

    <script>
        const messenger = document.getElementById("autoMessenger");

        function hideMessengerButton() {

            if (!messenger.shadowRoot) {
                return;
            }

            /*
             * Dialogflow Messenger floating button
             */
            const button =
                messenger.shadowRoot.querySelector("#widgetIcon");

            if (button) {
                button.style.display = "none";
            }

            /*
             * Hide wrapper if it only contains
             * the floating button.
             */
            const wrapper =
                messenger.shadowRoot.querySelector(".df-messenger-wrapper");

            if (wrapper) {
                const icon =
                    wrapper.querySelector("#widgetIcon");

                if (icon) {
                    icon.style.display = "none";
                }
            }
        }

        /*
         * Wait until Dialogflow Messenger is loaded
         */
        messenger.addEventListener(
            "df-messenger-loaded",
            () => {

                setTimeout(() => {
                    hideMessengerButton();
                }, 300);

                setTimeout(() => {
                    hideMessengerButton();
                }, 1000);

                setTimeout(() => {
                    hideMessengerButton();
                }, 2000);
            }
        );

        /*
         * Extra check because Messenger can
         * recreate its internal elements.
         */
        setInterval(() => {
            hideMessengerButton();
        }, 1000);
    </script>

</body>
</html>
