<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoHub - AUTO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        /*
         * Make Dialogflow Messenger fill
         * the complete browser window.
         */
        df-messenger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;

            --df-messenger-button-titlebar-color: #28a745;
            --df-messenger-button-titlebar-font-color: #ffffff;

            --df-messenger-chat-background-color: #ffffff;

            --df-messenger-bot-message: #f1f3f5;
            --df-messenger-user-message: #28a745;

            --df-messenger-font-color: #212529;

            --df-messenger-input-box-color: #ffffff;
            --df-messenger-input-font-color: #212529;
            --df-messenger-input-placeholder-font-color: #6c757d;

            --df-messenger-send-icon: #28a745;
        }

        /*
         * Desktop
         */
        @media (min-width: 601px) {
            df-messenger {
                width: 100vw;
                height: 100vh;
            }
        }

        /*
         * Mobile
         */
        @media (max-width: 600px) {
            df-messenger {
                width: 100vw;
                height: 100dvh;
            }
        }
    </style>

    <!-- Dialogflow Messenger -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
</head>

<body>

    <df-messenger
        intent="WELCOME"
        chat-title="AUTO"
        agent-id="075a38f9-83fe-43cc-916a-02ff3234b524"
        language-code="en"
        expand>
    </df-messenger>

</body>
</html>
